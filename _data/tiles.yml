- title: "ABLeS"
  description: "Provides access to (1) computational and data infrastructure, (2) specialised expertise, (3) support for adopting best practices and sharing outputs, and (4) a community-driven repository of bioinformatics software."
  url: https://australianbiocommons.github.io/ables/index
  type: Service
  category: Compute
- title: "BioShell"
  description: "A ready-to-use cloud bioinformatics environment for life-science researchers, trainers, and developers."
  url: https://sydney-informatics-hub.github.io/BioShell-User-Guide/
  type: Service
  category: Cloud bioinformatics environment
- title: "The Australian Nextflow Seqera Service"
  description: "Provides access to a centralised web platform for managing, launching, and monitoring the execution of Nextflow bioinformatics pipelines on Seqera-compatible compute environments."
  url: https://australianbiocommons.github.io/nextflow-seqera/
  type: Service
  category: Workflow execution
- title: "Australian Tree of Life"
  description: "Infrastructure for the rapid generation and publication of genome assemblies and annotations."
  url: https://australianbiocommons.github.io/atol/
  type: Service
  category: Genome assemblies and annotations
- title: "Australian Apollo Service"
  description: "Hosting of genome assembly and supporting evidence files, so you and your team can focus on the annotation curation itself."
  url: https://apollo-portal.genome.edu.au/resources/documentation/
  type: Service
  category: Genome annotations